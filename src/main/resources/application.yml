spring:
  application:
    name: spring-service-modular-monolith
  profiles:
    # active: ${APP_ENV:dev}
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-change-in-production-min-256-bit}
    expiration-ms: ${JWT_EXPIRATION_MS:120000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

services:
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-boilerplate_db}
      POSTGRES_USER: ${DB_USER:-boilerplate_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boilerplate_pass}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-boilerplate_user} -d ${DB_NAME:-boilerplate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: boilerplate-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-boilerplate_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-boilerplate_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-boilerplate_pass}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
